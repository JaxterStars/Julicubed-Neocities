---
title: Hello World!
layout: /base.njk
style: /css/blog.css
---

<div class="blog-content">
    <div class="sidebar-m">
        <div class="box" style="margin:unset">
            <div class="box-title">
                <span>BLOG</span>
            </div>
            <div class="box-content">
                <ul>
                    {% for post in collections.blog | reverse %}
                    <li class="posts">
                        <a href="{{ post.url }}"><span>{{ post.data.date}}</span> {{ post.data.title }} - <span class="tags">{{ post.data.tags }}</span></a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>

    <div class="sidebar-r">
        <div class="box" style="margin:unset">
            <div class="box-title">
                <span>BLOG</span>
            </div>
            <div class="box-content">

            </div>
        </div>

    </div>
</div>
